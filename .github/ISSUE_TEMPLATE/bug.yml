name: Bug report
description: Report a reproducible defect
title: "[BUG] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and impact
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected versus actual behaviour
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: [P0, P1, P2, P3]
      default: 2
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Fix acceptance criteria
      value: |
        - [ ] Reproduction no longer fails
        - [ ] Regression test added or updated
    validations:
      required: true
